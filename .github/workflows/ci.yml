name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify runtime versions
        run: |
          node --version
          npm --version
          command -v pwsh
          pwsh -NoProfile -NonInteractive -Command 'if ($PSVersionTable.PSVersion.Major -lt 7) { exit 1 }; $PSVersionTable.PSVersion.ToString()'

      - name: Install dependencies
        run: npm ci --include=dev --include=optional --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Run offline tests
        run: node --test --test-concurrency=1 test/*.test.js

      - name: Run offline pilot tests
        run: node --test --test-concurrency=1 test/live-pilot/*.test.js

      - name: Verify tracked working tree
        run: |
          git diff --check
          git diff --exit-code
